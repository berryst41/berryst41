name: 최근 업데이트 갱신

on:
  schedule:
    - cron: "17 * * * *"   # 매시간 한 번
  workflow_dispatch:        # Actions 탭에서 직접 눌러 돌릴 수도 있어요

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/update_recent.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 바뀐 게 있으면 저장
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "최근 업데이트 자동 갱신"
          git push
